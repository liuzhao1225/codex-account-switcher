name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DMG_NAME: Codex-Account-Switcher-macos-arm64.dmg
  EXE_NAME: Codex-Account-Switcher-windows-x64.exe

jobs:
  validate:
    if: github.repository == '4379711/codex-account-switcher' && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version and tagged commit
        id: version
        run: |
          set -euo pipefail
          version=$(node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME")
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release routing
        run: node --test scripts/tests/*.test.mjs

  windows:
    needs: validate
    uses: ./.github/workflows/windows.yml

  macos:
    needs: validate
    runs-on: macos-26
    env:
      CODESIGN_IDENTITY: "-"
      SWIFT_BUILD_ARCH: arm64
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run release tests
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          swift --version
          brew install fish
          ./scripts/run-tests.sh

      - name: Package and verify the ad hoc signed DMG
        run: |
          set -euo pipefail
          work_dir=$(mktemp -d "$RUNNER_TEMP/codex-release.XXXXXX")
          dmg_root="$work_dir/root"
          mount_point="$work_dir/mount"
          mount_attached=false

          cleanup() {
            if [[ "$mount_attached" == true ]]; then
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            fi
            rm -rf "$work_dir"
          }
          trap cleanup EXIT

          app_path=$(./scripts/package-local-app.sh | tail -n 1)
          mkdir -p "$dmg_root" "$mount_point" dist
          ditto "$app_path" "$dmg_root/Codex Account Switcher.app"
          cp LICENSE "$dmg_root/LICENSE.txt"
          ln -s /Applications "$dmg_root/Applications"

          artifact="dist/$DMG_NAME"
          hdiutil create -volname "Codex Account Switcher" -srcfolder "$dmg_root" -format UDZO "$artifact"
          codesign --force --sign - "$artifact"
          codesign --verify --verbose=2 "$artifact"
          hdiutil verify "$artifact"

          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$artifact"
          mount_attached=true
          mounted_app="$mount_point/Codex Account Switcher.app"
          info_plist="$mounted_app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")" = "$RELEASE_VERSION"
          test "$(lipo -archs "$mounted_app/Contents/MacOS/CodexAccountSwitcher")" = "$SWIFT_BUILD_ARCH"
          test -s "$mounted_app/Contents/Resources/AppIcon.icns"
          cmp LICENSE "$mounted_app/Contents/Resources/LICENSE.txt"
          cmp LICENSE "$mount_point/LICENSE.txt"
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          hdiutil detach "$mount_point"
          mount_attached=false

          cd dist
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"

      - name: Upload the verified macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Account-Switcher-macos-arm64
          path: |
            dist/${{ env.DMG_NAME }}
            dist/${{ env.DMG_NAME }}.sha256
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Codex-Account-Switcher-*
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Releases
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shasum -a 256 --check "$DMG_NAME.sha256" "$EXE_NAME.sha256"
          gh release create "$GITHUB_REF_NAME" "$DMG_NAME" "$DMG_NAME.sha256" "$EXE_NAME" "$EXE_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "包含 Apple 芯片 Mac 的 DMG 和 Windows x64 的 EXE。macOS 安装包使用 ad hoc 签名，首次打开可能需要在「隐私与安全性」中确认。"
