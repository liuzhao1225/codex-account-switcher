name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      SWIFT_BUILD_ARCH: arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release ref and toolchain
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(uname -m)" = "arm64"
          swift --version

      - name: Run tests
        run: |
          swift test
          ./scripts/run-core-checks.sh

      - name: Package GitHub build
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          app_path=$(./scripts/package-local-app.sh | tail -n 1)
          artifact=".build/artifacts/Codex-Account-Switcher-${GITHUB_REF_NAME}-macos-arm64.zip"

          mkdir -p .build/artifacts
          rm -f "$artifact" "$artifact.sha256"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          file "$app_path/Contents/MacOS/CodexAccountSwitcher"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$artifact"
          (
            cd "$(dirname "$artifact")"
            shasum -a 256 "$(basename "$artifact")" > "$(basename "$artifact").sha256"
          )
          cat "$artifact.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact=".build/artifacts/Codex-Account-Switcher-${GITHUB_REF_NAME}-macos-arm64.zip"
          gh release create "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256" \
            --title "Codex Account Switcher ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --prerelease \
            --verify-tag
