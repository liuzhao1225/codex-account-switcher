name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      SWIFT_BUILD_ARCH: arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release ref and toolchain
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(uname -m)" = "arm64"
          swift --version

      - name: Run tests
        run: |
          swift test
          ./scripts/run-core-checks.sh

      - name: Package, notarize, and staple Developer ID signed DMG
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/build-certificate.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          intermediate_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          login_keychain=$(security default-keychain -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          mount_point="$RUNNER_TEMP/dmg-mount"
          mount_attached=false

          cleanup() {
            if [[ "$mount_attached" == true ]]; then
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            fi
            security list-keychains -d user -s "$login_keychain" >/dev/null 2>&1 || true
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path" "$api_key_path" "$intermediate_path"
          }
          trap cleanup EXIT

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"
          test -s "$certificate_path"
          test -s "$api_key_path"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          chmod 600 "$api_key_path"
          curl --fail --silent --show-error --location \
            'https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer' \
            --output "$intermediate_path"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $intermediate_path" \
            | shasum -a 256 -c -

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security add-certificates -k "$keychain_path" "$intermediate_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" "$login_keychain"

          signing_identity=$(security find-identity -v -p codesigning | awk '/Developer ID Application:/ {print $2; exit}')
          test -n "$signing_identity"

          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          export CODESIGN_IDENTITY="$signing_identity"
          app_path=$(./scripts/package-local-app.sh | tail -n 1)
          app_archive="$RUNNER_TEMP/Codex-Account-Switcher.app.zip"
          artifact=".build/artifacts/Codex-Account-Switcher-${GITHUB_REF_NAME}-macos-arm64.dmg"
          dmg_root="$RUNNER_TEMP/dmg-root"

          mkdir -p .build/artifacts
          codesign --verify --deep --strict --verbose=4 "$app_path"
          file "$app_path/Contents/MacOS/CodexAccountSwitcher"

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$app_archive"
          xcrun notarytool submit "$app_archive" \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --timeout 30m \
            --output-format json > "$RUNNER_TEMP/app-notarization.json"
          ruby -rjson -e '
            result = JSON.parse(File.read(ARGV.fetch(0)))
            puts "app_notarization_id=#{result.fetch("id", "unknown")}"
            status = result.fetch("status", "missing")
            abort "app_notarization_status=#{status}" unless status == "Accepted"
            puts "app_notarization_status=#{status}"
          ' "$RUNNER_TEMP/app-notarization.json"
          xcrun stapler staple -v "$app_path"
          xcrun stapler validate -v "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          mkdir -p "$dmg_root"
          ditto "$app_path" "$dmg_root/Codex Account Switcher.app"
          cp LICENSE "$dmg_root/LICENSE.txt"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "Codex Account Switcher" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            "$artifact"
          codesign --force --timestamp --sign "$signing_identity" "$artifact"
          codesign --verify --verbose=4 "$artifact"
          xcrun notarytool submit "$artifact" \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --timeout 30m \
            --output-format json > "$RUNNER_TEMP/dmg-notarization.json"
          ruby -rjson -e '
            result = JSON.parse(File.read(ARGV.fetch(0)))
            puts "dmg_notarization_id=#{result.fetch("id", "unknown")}"
            status = result.fetch("status", "missing")
            abort "dmg_notarization_status=#{status}" unless status == "Accepted"
            puts "dmg_notarization_status=#{status}"
          ' "$RUNNER_TEMP/dmg-notarization.json"
          xcrun stapler staple -v "$artifact"
          xcrun stapler validate -v "$artifact"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$artifact"

          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$artifact"
          mount_attached=true
          mounted_app="$mount_point/Codex Account Switcher.app"
          mounted_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mounted_app/Contents/Info.plist")
          test "$mounted_version" = "$RELEASE_VERSION"
          mounted_icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$mounted_app/Contents/Info.plist")
          test "$mounted_icon" = "AppIcon"
          test -s "$mounted_app/Contents/Resources/AppIcon.icns"
          file "$mounted_app/Contents/Resources/AppIcon.icns" | grep -q 'Mac OS X icon'
          test -s "$mounted_app/Contents/Resources/LICENSE.txt"
          grep -Fq 'Copyright (c) 2026 liuzhao1225' "$mounted_app/Contents/Resources/LICENSE.txt"
          test -s "$mount_point/LICENSE.txt"
          grep -Fq 'Copyright (c) 2026 liuzhao1225' "$mount_point/LICENSE.txt"
          codesign --verify --deep --strict --verbose=4 "$mounted_app"
          xcrun stapler validate -v "$mounted_app"
          spctl --assess --type execute --verbose=4 "$mounted_app"
          hdiutil detach "$mount_point"
          mount_attached=false

          (
            cd "$(dirname "$artifact")"
            shasum -a 256 "$(basename "$artifact")" > "$(basename "$artifact").sha256"
          )
          cat "$artifact.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact=".build/artifacts/Codex-Account-Switcher-${GITHUB_REF_NAME}-macos-arm64.dmg"
          gh release create "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256" \
            --title "Codex Account Switcher ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --latest \
            --verify-tag
