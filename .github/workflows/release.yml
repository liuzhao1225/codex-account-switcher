name: Release macOS app

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      SWIFT_BUILD_ARCH: arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve release version, tag, and action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin \
            refs/heads/main:refs/remotes/origin/main

          release_version=$(sed -n 's/^version:[[:space:]]*\([^[:space:]]*\)$/\1/p' CITATION.cff)
          package_version=$(sed -n 's/^APP_VERSION=${RELEASE_VERSION:-\([^}]*\)}$/\1/p' scripts/package-local-app.sh)
          client_version=$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)",$/\1/p' Sources/CodexAccountSwitcher/CodexClient.swift)

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "CITATION.cff has an invalid release version: '$release_version'" >&2
            exit 1
          fi
          if [[ "$package_version" != "$release_version" ]]; then
            echo "Package default version '$package_version' does not match CITATION.cff '$release_version'" >&2
            exit 1
          fi
          if [[ "$client_version" != "$release_version" ]]; then
            echo "CodexClient version '$client_version' does not match CITATION.cff '$release_version'" >&2
            exit 1
          fi

          release_tag="v${release_version}"
          head_sha=$(git rev-parse HEAD^{commit})
          main_sha=$(git rev-parse origin/main^{commit})

          case "$GITHUB_REF" in
            refs/heads/main)
              if [[ "$head_sha" != "$main_sha" ]]; then
                echo "main workflow commit $head_sha is not current origin/main $main_sha" >&2
                exit 1
              fi
              ;;
            refs/tags/*)
              event_tag=${GITHUB_REF#refs/tags/}
              if [[ "$event_tag" != "$release_tag" ]]; then
                echo "Tag event '$event_tag' does not match repository version '$release_tag'" >&2
                exit 1
              fi
              if ! git show-ref --verify --quiet "refs/tags/${release_tag}"; then
                echo "Tag event ref 'refs/tags/${release_tag}' was not fetched" >&2
                exit 1
              fi
              tag_commit=$(git rev-parse "refs/tags/${release_tag}^{commit}")
              if [[ "$head_sha" != "$main_sha" || "$tag_commit" != "$main_sha" ]]; then
                echo "Tag '$release_tag' commit $tag_commit and workflow commit $head_sha must both equal origin/main $main_sha" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release ref '$GITHUB_REF'" >&2
              exit 1
              ;;
          esac

          {
            echo "RELEASE_VERSION=$release_version"
            echo "RELEASE_TAG=$release_tag"
          } >> "$GITHUB_ENV"

          release_tags=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')
          if grep -Fxq "$release_tag" <<< "$release_tags"; then
            echo "SHOULD_RELEASE=false" >> "$GITHUB_ENV"
            echo "GitHub Release '$release_tag' already exists; publishing steps are skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if git show-ref --verify --quiet "refs/tags/${release_tag}"; then
              tag_commit=$(git rev-parse "refs/tags/${release_tag}^{commit}")
              if [[ "$tag_commit" != "$main_sha" ]]; then
                echo "Tag conflict: '$release_tag' points to $tag_commit, expected current origin/main $main_sha" >&2
                exit 1
              fi
              echo "Reusing existing tag '$release_tag' at $tag_commit."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$release_tag" "$main_sha" -m "Codex Account Switcher $release_tag"
              git push origin "refs/tags/${release_tag}"
              echo "Created annotated tag '$release_tag' at $main_sha."
            fi
          fi

          resolved_tag_commit=$(git rev-parse "refs/tags/${release_tag}^{commit}")
          if [[ "$resolved_tag_commit" != "$main_sha" ]]; then
            echo "Resolved tag '$release_tag' points to $resolved_tag_commit, expected origin/main $main_sha" >&2
            exit 1
          fi

          echo "SHOULD_RELEASE=true" >> "$GITHUB_ENV"
          echo "Publishing '$release_tag' from $main_sha in this workflow run." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate release toolchain
        if: env.SHOULD_RELEASE == 'true'
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          swift --version

      - name: Run release tests
        if: env.SHOULD_RELEASE == 'true'
        run: |
          set -euo pipefail
          swift test
          ./scripts/run-core-checks.sh

      - name: Package, notarize, and staple Developer ID signed DMG
        if: env.SHOULD_RELEASE == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/build-certificate.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          intermediate_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          login_keychain=$(security default-keychain -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          mount_point="$RUNNER_TEMP/dmg-mount"
          mount_attached=false

          cleanup() {
            if [[ "$mount_attached" == true ]]; then
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            fi
            security list-keychains -d user -s "$login_keychain" >/dev/null 2>&1 || true
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path" "$api_key_path" "$intermediate_path"
          }
          trap cleanup EXIT

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"
          test -s "$certificate_path"
          test -s "$api_key_path"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          chmod 600 "$api_key_path"
          curl --fail --silent --show-error --location \
            'https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer' \
            --output "$intermediate_path"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $intermediate_path" \
            | shasum -a 256 -c -

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security add-certificates -k "$keychain_path" "$intermediate_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" "$login_keychain"

          signing_identity=$(security find-identity -v -p codesigning | awk '/Developer ID Application:/ {print $2; exit}')
          test -n "$signing_identity"

          export CODESIGN_IDENTITY="$signing_identity"
          app_path=$(./scripts/package-local-app.sh | tail -n 1)
          app_archive="$RUNNER_TEMP/Codex-Account-Switcher.app.zip"
          artifact=".build/artifacts/Codex-Account-Switcher-${RELEASE_TAG}-macos-arm64.dmg"
          dmg_root="$RUNNER_TEMP/dmg-root"

          mkdir -p .build/artifacts
          codesign --verify --deep --strict --verbose=4 "$app_path"
          file "$app_path/Contents/MacOS/CodexAccountSwitcher"

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$app_archive"
          xcrun notarytool submit "$app_archive" \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --timeout 30m \
            --output-format json > "$RUNNER_TEMP/app-notarization.json"
          ruby -rjson -e '
            result = JSON.parse(File.read(ARGV.fetch(0)))
            puts "app_notarization_id=#{result.fetch("id", "unknown")}"
            status = result.fetch("status", "missing")
            abort "app_notarization_status=#{status}" unless status == "Accepted"
            puts "app_notarization_status=#{status}"
          ' "$RUNNER_TEMP/app-notarization.json"
          xcrun stapler staple -v "$app_path"
          xcrun stapler validate -v "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          mkdir -p "$dmg_root"
          ditto "$app_path" "$dmg_root/Codex Account Switcher.app"
          cp LICENSE "$dmg_root/LICENSE.txt"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "Codex Account Switcher" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            "$artifact"
          codesign --force --timestamp --sign "$signing_identity" "$artifact"
          codesign --verify --verbose=4 "$artifact"
          xcrun notarytool submit "$artifact" \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --timeout 30m \
            --output-format json > "$RUNNER_TEMP/dmg-notarization.json"
          ruby -rjson -e '
            result = JSON.parse(File.read(ARGV.fetch(0)))
            puts "dmg_notarization_id=#{result.fetch("id", "unknown")}"
            status = result.fetch("status", "missing")
            abort "dmg_notarization_status=#{status}" unless status == "Accepted"
            puts "dmg_notarization_status=#{status}"
          ' "$RUNNER_TEMP/dmg-notarization.json"
          xcrun stapler staple -v "$artifact"
          xcrun stapler validate -v "$artifact"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$artifact"

          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$artifact"
          mount_attached=true
          mounted_app="$mount_point/Codex Account Switcher.app"
          mounted_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mounted_app/Contents/Info.plist")
          test "$mounted_version" = "$RELEASE_VERSION"
          mounted_icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$mounted_app/Contents/Info.plist")
          test "$mounted_icon" = "AppIcon"
          test -s "$mounted_app/Contents/Resources/AppIcon.icns"
          file "$mounted_app/Contents/Resources/AppIcon.icns" | grep -q 'Mac OS X icon'
          test -s "$mounted_app/Contents/Resources/LICENSE.txt"
          grep -Fq 'Copyright (c) 2026 liuzhao1225' "$mounted_app/Contents/Resources/LICENSE.txt"
          test -s "$mount_point/LICENSE.txt"
          grep -Fq 'Copyright (c) 2026 liuzhao1225' "$mount_point/LICENSE.txt"
          codesign --verify --deep --strict --verbose=4 "$mounted_app"
          xcrun stapler validate -v "$mounted_app"
          spctl --assess --type execute --verbose=4 "$mounted_app"
          hdiutil detach "$mount_point"
          mount_attached=false

          (
            cd "$(dirname "$artifact")"
            shasum -a 256 "$(basename "$artifact")" > "$(basename "$artifact").sha256"
          )
          cat "$artifact.sha256"

      - name: Create GitHub Release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          main_commit=$(git rev-parse origin/main^{commit})
          test "$tag_commit" = "$main_commit"
          artifact=".build/artifacts/Codex-Account-Switcher-${RELEASE_TAG}-macos-arm64.dmg"
          gh release create "$RELEASE_TAG" "$artifact" "$artifact.sha256" \
            --title "Codex Account Switcher ${RELEASE_TAG}" \
            --notes-file .github/release-notes.md \
            --latest \
            --verify-tag
