name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/check-site-geo.mjs"
      - "scripts/prepare-macos-feed.mjs"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Release macOS app"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check SEO and GEO metadata
        run: node scripts/check-site-geo.mjs

      - name: Prepare the macOS-only Sparkle feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-macos-feed.mjs

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
